<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#080808"/>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=b9"/>
<style>html{background:#080808}</style>
<title>Restablecer contraseña · Powerbuilding.gym</title>
<link rel="stylesheet" href="assets/css/styles.css?v=b11"/>
<style>
  body{background:var(--dark);color:var(--light);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.25rem}
  .rp-card{background:var(--dark2);border:1px solid rgba(233,30,140,.2);border-radius:20px;padding:2rem;width:100%;max-width:390px}
  .rp-card h1{font-size:1.25rem;margin:0 0 .4rem;text-align:center}
  .rp-card .field input{font-size:16px}
  .rp-card .btn-grad:disabled{opacity:.6;cursor:not-allowed}
  .rp-home{display:block;text-align:center;margin-top:1rem;font-size:13px;color:var(--pink2);text-decoration:none}
</style>
</head>
<body>
<main class="rp-card">
  <div class="modal-logo"><div class="logo-circle">PB</div></div>
  <h1 id="rpTitulo">Elige tu nueva contraseña</h1>
  <p class="legal-note" id="rpInfo" style="margin:0 0 1rem">Escríbela dos veces. Este enlace se puede usar una sola vez.</p>
  <form id="rpForm" novalidate>
    <div class="field"><label for="rpPass">Contraseña nueva</label><input type="password" id="rpPass" autocomplete="new-password" oninput="pwActualizar('rpPass','rpMeter')"/></div>
    <div id="rpMeter" class="pw-meter" aria-live="polite"></div>
    <div class="field"><label for="rpPass2">Repite la contraseña</label><input type="password" id="rpPass2" autocomplete="new-password"/></div>
    <div class="ferr" id="rpErr" role="alert"></div>
    <button class="btn-grad" id="rpBtn" type="submit">Cambiar contraseña</button>
  </form>
  <div class="fok" id="rpOk" role="status" style="font-size:14px;text-align:center"></div>
  <a class="rp-home" id="rpHome" href="/#recuperar">Solicitar un enlace nuevo</a>
</main>
<script src="assets/js/password-ui.js?v=b8"></script>
<script>
(function(){
  var host=location.hostname;
  var API=(host==='localhost'||host==='127.0.0.1')?'http://localhost:3000/api':'https://powerbuildinggym-production.up.railway.app/api';
  function $(id){return document.getElementById(id);}
  // El token viaja en el fragmento (#t=...): no se envía al servidor web ni queda en registros.
  var m=/^#t=([A-Za-z0-9_-]{43})$/.exec(location.hash||'');
  var token=m?m[1]:null;
  // Se borra de la barra de direcciones y del historial apenas se lee.
  history.replaceState(null,'',location.pathname);
  function mostrarError(t){$('rpErr').textContent=t;$('rpErr').classList.add('show');}
  if(!token){
    $('rpForm').style.display='none';
    $('rpInfo').textContent='';
    mostrarError('El enlace no es válido o venció. Solicita uno nuevo.');
    return;
  }
  $('rpForm').addEventListener('submit',function(ev){
    ev.preventDefault();
    $('rpErr').classList.remove('show');
    var p1=$('rpPass').value,p2=$('rpPass2').value;
    var e=pwError(p1);
    if(e){mostrarError(e);return;}
    if(p1!==p2){mostrarError('Las contraseñas no coinciden');return;}
    $('rpBtn').disabled=true;
    fetch(API+'/auth/restablecer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:p1})})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(d){return {ok:r.ok,d:d};});})
      .then(function(x){
        if(!x.ok){mostrarError(x.d.error||'No se pudo cambiar la contraseña');$('rpBtn').disabled=false;return;}
        $('rpForm').style.display='none';
        $('rpTitulo').textContent='Contraseña actualizada';
        $('rpInfo').textContent='';
        $('rpOk').textContent=x.d.message||'Contraseña actualizada.';$('rpOk').classList.add('show');
        $('rpHome').textContent='Ir a iniciar sesión';$('rpHome').setAttribute('href','/');
      })
      .catch(function(){mostrarError('No se pudo conectar con el servidor. Intenta nuevamente.');$('rpBtn').disabled=false;});
  });
})();
</script>
</body>
</html>
